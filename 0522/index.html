<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editable Site Builder</title>
  <meta name="description" content="A minimal editable landing page with live controls for colors, content, sections, and layout." />
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #5f5f5f;
      --card: #f6f6f6;
      --accent: #111111;
      --button-text: #ffffff;
      --radius: 28px;
      --shadow: 0 20px 60px rgba(0,0,0,.10);
      --hero-size: clamp(56px, 10vw, 150px);
      --title-size: clamp(28px, 4vw, 56px);
      --body-size: 18px;
      --maxw: 1220px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, Arial, "Helvetica Neue", Helvetica, sans-serif;
      transition: background-color .25s ease, color .25s ease;
    }

    a { color: inherit; text-decoration: none; }

    .site-shell {
      min-height: 100vh;
    }

    .editor-toggle {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 60;
      border: none;
      border-radius: 999px;
      padding: 13px 18px;
      background: var(--accent);
      color: var(--button-text);
      font-weight: 800;
      letter-spacing: .01em;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .editor {
      position: fixed;
      top: 68px;
      right: 18px;
      z-index: 55;
      width: min(420px, calc(100vw - 36px));
      max-height: calc(100vh - 86px);
      overflow: auto;
      background: rgba(255,255,255,.96);
      color: #111;
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 26px;
      box-shadow: 0 30px 90px rgba(0,0,0,.16);
      backdrop-filter: blur(10px);
      padding: 18px;
      transition: opacity .2s ease, transform .2s ease;
    }

    .editor.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
    }

    .editor h2 {
      margin: 0 0 14px;
      font-size: 20px;
    }

    .editor-section {
      padding: 14px 0 6px;
      border-top: 1px solid rgba(0,0,0,.08);
    }

    .editor-section:first-of-type {
      border-top: none;
      padding-top: 4px;
    }

    .editor-section h3 {
      margin: 0 0 12px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #666;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: #555;
    }

    .field input[type="text"],
    .field input[type="number"],
    .field textarea {
      width: 100%;
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 14px;
      padding: 12px 13px;
      font: inherit;
      resize: vertical;
      background: #fff;
      color: #111;
    }

    .field input[type="color"] {
      width: 100%;
      height: 46px;
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 14px;
      background: #fff;
      padding: 4px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .actions {
      display: flex;
      gap: 10px;
      position: sticky;
      bottom: 0;
      background: linear-gradient(to top, rgba(255,255,255,1), rgba(255,255,255,.9));
      padding-top: 12px;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 12px 14px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .btn.primary {
      background: #111;
      color: #fff;
    }

    .btn.secondary {
      background: #efefef;
      color: #111;
    }

    .page {
      padding: 32px 20px 60px;
    }

    .container {
      width: min(var(--maxw), calc(100vw - 40px));
      margin: 0 auto;
    }

    .hero {
      min-height: 92vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 36px 0 12px;
    }

    .eyebrow {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .22em;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .hero-title {
      font-size: var(--hero-size);
      font-weight: 900;
      line-height: .94;
      letter-spacing: -.05em;
      margin: 0 auto;
      max-width: 10ch;
      word-break: break-word;
    }

    .hero-subtitle {
      font-size: var(--body-size);
      line-height: 1.8;
      color: var(--muted);
      max-width: 800px;
      margin: 22px auto 0;
      white-space: pre-wrap;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 28px;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 160px;
      padding: 14px 20px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--button-text);
      font-weight: 800;
      box-shadow: var(--shadow);
    }

    .ghost-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 160px;
      padding: 14px 20px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.10);
      color: var(--fg);
      font-weight: 800;
      background: transparent;
    }

    .section {
      padding: 42px 0;
    }

    .section-head {
      display: grid;
      gap: 12px;
      margin-bottom: 22px;
    }

    .section-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .22em;
      color: var(--muted);
    }

    .section-title {
      font-size: var(--title-size);
      line-height: 1.04;
      letter-spacing: -.04em;
      margin: 0;
    }

    .section-text {
      font-size: var(--body-size);
      line-height: 1.85;
      color: var(--muted);
      max-width: 900px;
      white-space: pre-wrap;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      margin-top: 28px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: var(--shadow);
      min-height: 240px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .card-index {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .18em;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 28px;
      line-height: 1.08;
      letter-spacing: -.03em;
      margin: 0;
    }

    .card-text {
      font-size: 16px;
      line-height: 1.8;
      color: var(--muted);
      margin-top: 14px;
      white-space: pre-wrap;
    }

    .split {
      display: grid;
      grid-template-columns: .95fr 1.05fr;
      gap: 22px;
      margin-top: 18px;
    }

    .feature-block {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .mini {
      background: var(--bg);
      border-radius: 22px;
      padding: 20px;
      border: 1px solid rgba(0,0,0,.08);
    }

    .mini h4 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .mini p {
      margin: 0;
      color: var(--muted);
      line-height: 1.75;
      font-size: 15px;
      white-space: pre-wrap;
    }

    .footer {
      padding-top: 24px;
      border-top: 1px solid rgba(0,0,0,.08);
      margin-top: 24px;
      color: var(--muted);
      font-size: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      justify-content: space-between;
    }

    @media (max-width: 980px) {
      .cards,
      .split,
      .feature-grid {
        grid-template-columns: 1fr;
      }

      .hero {
        min-height: 78vh;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 22px 14px 48px;
      }

      .container {
        width: min(var(--maxw), calc(100vw - 28px));
      }

      .row {
        grid-template-columns: 1fr;
      }

      .editor-toggle {
        top: 12px;
        right: 12px;
      }

      .editor {
        top: 58px;
        right: 12px;
        width: calc(100vw - 24px);
        max-height: calc(100vh - 70px);
      }

      .card {
        min-height: unset;
      }
    }
  </style>
</head>
<body>
  <button class="editor-toggle" id="editorToggle">編輯網站 Edit Site</button>

  <aside class="editor" id="editorPanel">
    <h2>網站編輯器 Website Editor</h2>

    <div class="editor-section">
      <h3>整體樣式 Global Style</h3>
      <div class="row">
        <div class="field">
          <label for="bg">背景色 Background</label>
          <input id="bg" type="color" />
        </div>
        <div class="field">
          <label for="fg">主文字色 Text</label>
          <input id="fg" type="color" />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="muted">次文字色 Muted</label>
          <input id="muted" type="color" />
        </div>
        <div class="field">
          <label for="card">卡片色 Card</label>
          <input id="card" type="color" />
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="accent">按鈕色 Accent</label>
          <input id="accent" type="color" />
        </div>
        <div class="field">
          <label for="buttonText">按鈕文字色 Button Text</label>
          <input id="buttonText" type="color" />
        </div>
      </div>
    </div>

    <div class="editor-section">
      <h3>首頁 Hero</h3>
      <div class="field">
        <label for="eyebrow">上方小標 Eyebrow</label>
        <input id="eyebrow" type="text" maxlength="80" />
      </div>
      <div class="field">
        <label for="heroTitle">主標題 Hero Title</label>
        <input id="heroTitle" type="text" maxlength="60" />
      </div>
      <div class="field">
        <label for="heroSubtitle">副標 Hero Subtitle</label>
        <textarea id="heroSubtitle" rows="4" maxlength="500"></textarea>
      </div>
      <div class="row">
        <div class="field">
          <label for="primaryCta">主按鈕 Primary Button</label>
          <input id="primaryCta" type="text" maxlength="40" />
        </div>
        <div class="field">
          <label for="secondaryCta">次按鈕 Secondary Button</label>
          <input id="secondaryCta" type="text" maxlength="40" />
        </div>
      </div>
      <div class="field">
        <label for="heroSize">主標大小 Hero Size (px)</label>
        <input id="heroSize" type="number" min="48" max="220" />
      </div>
    </div>

    <div class="editor-section">
      <h3>內容區塊 Main Section</h3>
      <div class="field">
        <label for="sectionLabel">區塊小標 Section Label</label>
        <input id="sectionLabel" type="text" maxlength="60" />
      </div>
      <div class="field">
        <label for="sectionTitle">區塊標題 Section Title</label>
        <input id="sectionTitle" type="text" maxlength="100" />
      </div>
      <div class="field">
        <label for="sectionText">區塊內文 Section Text</label>
        <textarea id="sectionText" rows="5" maxlength="700"></textarea>
      </div>
    </div>

    <div class="editor-section">
      <h3>三張卡片 Cards</h3>
      <div class="field">
        <label for="card1Title">卡片 1 標題</label>
        <input id="card1Title" type="text" maxlength="50" />
      </div>
      <div class="field">
        <label for="card1Text">卡片 1 內文</label>
        <textarea id="card1Text" rows="3" maxlength="260"></textarea>
      </div>

      <div class="field">
        <label for="card2Title">卡片 2 標題</label>
        <input id="card2Title" type="text" maxlength="50" />
      </div>
      <div class="field">
        <label for="card2Text">卡片 2 內文</label>
        <textarea id="card2Text" rows="3" maxlength="260"></textarea>
      </div>

      <div class="field">
        <label for="card3Title">卡片 3 標題</label>
        <input id="card3Title" type="text" maxlength="50" />
      </div>
      <div class="field">
        <label for="card3Text">卡片 3 內文</label>
        <textarea id="card3Text" rows="3" maxlength="260"></textarea>
      </div>
    </div>

    <div class="editor-section">
      <h3>下方資訊區 Lower Section</h3>
      <div class="field">
        <label for="featureTitle">左側標題 Left Title</label>
        <input id="featureTitle" type="text" maxlength="100" />
      </div>
      <div class="field">
        <label for="featureText">左側內文 Left Text</label>
        <textarea id="featureText" rows="4" maxlength="500"></textarea>
      </div>
      <div class="field">
        <label for="mini1Title">右側小區塊 1 標題</label>
        <input id="mini1Title" type="text" maxlength="50" />
      </div>
      <div class="field">
        <label for="mini1Text">右側小區塊 1 內文</label>
        <textarea id="mini1Text" rows="3" maxlength="220"></textarea>
      </div>
      <div class="field">
        <label for="mini2Title">右側小區塊 2 標題</label>
        <input id="mini2Title" type="text" maxlength="50" />
      </div>
      <div class="field">
        <label for="mini2Text">右側小區塊 2 內文</label>
        <textarea id="mini2Text" rows="3" maxlength="220"></textarea>
      </div>
    </div>

    <div class="editor-section">
      <h3>頁尾 Footer</h3>
      <div class="field">
        <label for="footerLeft">左側頁尾 Footer Left</label>
        <input id="footerLeft" type="text" maxlength="80" />
      </div>
      <div class="field">
        <label for="footerRight">右側頁尾 Footer Right</label>
        <input id="footerRight" type="text" maxlength="80" />
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" id="saveBtn">儲存 Save</button>
      <button class="btn secondary" id="resetBtn">重設 Reset</button>
    </div>
  </aside>

  <div class="site-shell">
    <div class="page">
      <div class="container">
        <section class="hero">
          <div>
            <div class="eyebrow" id="viewEyebrow"></div>
            <h1 class="hero-title" id="viewHeroTitle"></h1>
            <p class="hero-subtitle" id="viewHeroSubtitle"></p>
            <div class="hero-actions">
              <a href="#content" class="cta-button" id="viewPrimaryCta"></a>
              <a href="#details" class="ghost-button" id="viewSecondaryCta"></a>
            </div>
          </div>
        </section>

        <section class="section" id="content">
          <div class="section-head">
            <div class="section-label" id="viewSectionLabel"></div>
            <h2 class="section-title" id="viewSectionTitle"></h2>
            <div class="section-text" id="viewSectionText"></div>
          </div>

          <div class="cards">
            <article class="card">
              <div class="card-index">Card 01</div>
              <h3 class="card-title" id="viewCard1Title"></h3>
              <div class="card-text" id="viewCard1Text"></div>
            </article>
            <article class="card">
              <div class="card-index">Card 02</div>
              <h3 class="card-title" id="viewCard2Title"></h3>
              <div class="card-text" id="viewCard2Text"></div>
            </article>
            <article class="card">
              <div class="card-index">Card 03</div>
              <h3 class="card-title" id="viewCard3Title"></h3>
              <div class="card-text" id="viewCard3Text"></div>
            </article>
          </div>
        </section>

        <section class="section" id="details">
          <div class="split">
            <div class="feature-block">
              <div class="section-label">Overview</div>
              <h2 class="section-title" id="viewFeatureTitle"></h2>
              <div class="section-text" id="viewFeatureText"></div>
            </div>

            <div class="feature-grid">
              <div class="mini">
                <h4 id="viewMini1Title"></h4>
                <p id="viewMini1Text"></p>
              </div>
              <div class="mini">
                <h4 id="viewMini2Title"></h4>
                <p id="viewMini2Text"></p>
              </div>
            </div>
          </div>

          <footer class="footer">
            <div id="viewFooterLeft"></div>
            <div id="viewFooterRight"></div>
          </footer>
        </section>
      </div>
    </div>
  </div>

  <script>
    const storageKey = "editable-site-builder-v2";

    const defaults = {
      bg: "#ffffff",
      fg: "#111111",
      muted: "#5f5f5f",
      card: "#f6f6f6",
      accent: "#111111",
      buttonText: "#ffffff",
      eyebrow: "Editable Minimal Site",
      heroTitle: "LOVE",
      heroSubtitle: "這是一個可直接編輯的極簡首頁。你可以改背景、標題、內文、卡片區塊、按鈕文字與頁尾內容。\nThis is a live-edit landing page you can customize directly in the browser.",
      primaryCta: "Explore",
      secondaryCta: "Details",
      heroSize: 150,
      sectionLabel: "Main Section",
      sectionTitle: "你現在不只是改文字，而是能編排整個頁面。",
      sectionText: "用右上角的編輯器，你可以快速修改網站的視覺和內容，做出一頁式簡報站、個人頁、活動頁，或最基本的品牌首頁。",
      card1Title: "背景與色彩",
      card1Text: "可調整背景色、主文字色、次文字色、卡片底色，以及按鈕色。",
      card2Title: "內容與區塊",
      card2Text: "可調整 Hero 標題、副標、主區塊文字，以及三張內容卡片。",
      card3Title: "快速發布",
      card3Text: "編輯後可直接另存這個 HTML 檔，再丟到任何靜態主機上線。",
      featureTitle: "更像一個簡易網站編輯器，不只是標題輸入框。",
      featureText: "這個版本走的是最簡單、最直覺的方式：單一 HTML，打開就能編，儲存後會記住你在這台裝置上的設定。",
      mini1Title: "Live Editing",
      mini1Text: "每次輸入都會即時反映在畫面上，不需要重新整理。",
      mini2Title: "Browser Storage",
      mini2Text: "按下儲存後，設定會保存在 localStorage。",
      footerLeft: "Editable Site Builder",
      footerRight: "Single HTML · Responsive · Easy to Deploy"
    };

    const ids = Object.keys(defaults);

    const inputs = {};
    ids.forEach(id => {
      inputs[id] = document.getElementById(id);
    });

    const viewMap = {
      eyebrow: "viewEyebrow",
      heroTitle: "viewHeroTitle",
      heroSubtitle: "viewHeroSubtitle",
      primaryCta: "viewPrimaryCta",
      secondaryCta: "viewSecondaryCta",
      sectionLabel: "viewSectionLabel",
      sectionTitle: "viewSectionTitle",
      sectionText: "viewSectionText",
      card1Title: "viewCard1Title",
      card1Text: "viewCard1Text",
      card2Title: "viewCard2Title",
      card2Text: "viewCard2Text",
      card3Title: "viewCard3Title",
      card3Text: "viewCard3Text",
      featureTitle: "viewFeatureTitle",
      featureText: "viewFeatureText",
      mini1Title: "viewMini1Title",
      mini1Text: "viewMini1Text",
      mini2Title: "viewMini2Title",
      mini2Text: "viewMini2Text",
      footerLeft: "viewFooterLeft",
      footerRight: "viewFooterRight"
    };

    function sanitizeText(v, max = 700) {
      return String(v || "").replace(/\r/g, "").slice(0, max);
    }

    function clamp(n, min, max) {
      return Math.min(max, Math.max(min, Number(n) || min));
    }

    function getStoredState() {
      try {
        return JSON.parse(localStorage.getItem(storageKey) || "{}");
      } catch {
        return {};
      }
    }

    function getState() {
      const state = {};
      ids.forEach(id => {
        state[id] = inputs[id].value;
      });
      state.heroSize = clamp(state.heroSize, 48, 220);
      return state;
    }

    function setInputValues(state) {
      ids.forEach(id => {
        inputs[id].value = state[id];
      });
    }

    function render(state) {
      document.documentElement.style.setProperty("--bg", state.bg);
      document.documentElement.style.setProperty("--fg", state.fg);
      document.documentElement.style.setProperty("--muted", state.muted);
      document.documentElement.style.setProperty("--card", state.card);
      document.documentElement.style.setProperty("--accent", state.accent);
      document.documentElement.style.setProperty("--button-text", state.buttonText);
      document.documentElement.style.setProperty("--hero-size", "clamp(56px, 10vw, " + clamp(state.heroSize, 48, 220) + "px)");

      Object.entries(viewMap).forEach(([key, elementId]) => {
        const el = document.getElementById(elementId);
        if (el) el.textContent = sanitizeText(state[key], 700);
      });

      document.title = sanitizeText(state.heroTitle, 60) || "Editable Site Builder";
    }

    function saveState() {
      const state = getState();
      localStorage.setItem(storageKey, JSON.stringify(state));
      render(state);
    }

    function resetState() {
      localStorage.removeItem(storageKey);
      setInputValues(defaults);
      render(defaults);
    }

    const state = { ...defaults, ...getStoredState() };
    setInputValues(state);
    render(state);

    ids.forEach(id => {
      inputs[id].addEventListener("input", () => {
        render(getState());
      });
    });

    document.getElementById("saveBtn").addEventListener("click", saveState);
    document.getElementById("resetBtn").addEventListener("click", resetState);

    const panel = document.getElementById("editorPanel");
    document.getElementById("editorToggle").addEventListener("click", () => {
      panel.classList.toggle("hidden");
    });
  </script>
</body>
</html>
