<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOVE NIGGA</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
color:#111;
font-family:Arial,Helvetica,sans-serif;
}
.wrap{text-align:center;padding:40px}
h1{
margin:0;
font-size:clamp(72px,12vw,180px);
line-height:.9;
letter-spacing:-.06em;
font-weight:900;
}
p{
margin-top:20px;
color:#666;
font-size:18px;
line-height:1.8;
}
.buttons{
margin-top:36px;
display:flex;
gap:14px;
justify-content:center;
flex-wrap:wrap;
}
a{
text-decoration:none;
color:#111;
border:1px solid rgba(0,0,0,.12);
padding:14px 22px;
border-radius:999px;
font-weight:700;
transition:.2s ease;
}
a:hover{
transform:translateY(-2px);
background:#111;
color:#fff;
}
</style>
</head>
<body>
<div class="wrap">
<h1>LOVE</h1>

<p>
Minimal landing page.<br>
Clean, simple, deploy-ready.
</p>

<div class="buttons">
<a href="/about">About</a>
<a href="/editor">Editor</a>
</div>
</div>
</body>
</html>
