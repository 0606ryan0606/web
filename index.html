<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LOVE</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Inter,Arial,sans-serif;
background:#fff;
color:#111;
line-height:1.8;
overflow-x:hidden;
cursor:none;
}

/* =========================
RGB Aurora
========================= */

#aurora{
position:fixed;
inset:0;
pointer-events:none;
z-index:-1;
overflow:hidden;
}

#aurora::before{

content:"";

position:absolute;

width:900px;
height:900px;

border-radius:50%;

background:
radial-gradient(
circle,
rgba(255,0,100,.28) 0%,
rgba(0,255,255,.22) 35%,
rgba(255,255,0,.18) 60%,
transparent 80%
);

filter:blur(140px);

left:var(--mx,50%);
top:var(--my,50%);

transform:translate(-50%,-50%);

transition:
left .15s linear,
top .15s linear;
}

/* =========================
Cursor
========================= */

#cursor-glow{

position:fixed;

width:40px;
height:40px;

border-radius:50%;

background:
radial-gradient(
circle,
rgba(255,255,255,.95),
rgba(255,0,255,.5)
);

pointer-events:none;

transform:
translate(-50%,-50%);

mix-blend-mode:screen;

z-index:9999;

filter:blur(8px);
}

/* =========================
Navbar
========================= */

.nav{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
width:min(1180px,calc(100vw - 30px));
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 22px;
background:rgba(255,255,255,.84);
backdrop-filter:blur(14px);
border:1px solid rgba(0,0,0,.08);
border-radius:999px;
z-index:100;
}

.logo{
font-weight:900;
font-size:20px;
letter-spacing:-.04em;
}

.links{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.links a{
text-decoration:none;
color:#111;
font-weight:700;
padding:10px 16px;
border-radius:999px;
transition:.25s ease;
}

.links a:hover{
background:#111;
color:#fff;
}

/* =========================
Hero
========================= */

.hero{
min-height:70vh;
display:grid;
place-items:center;
padding:140px 20px 80px;
text-align:center;
}

.hero h1{

font-size:clamp(64px,12vw,180px);

line-height:.9;

letter-spacing:-.08em;

background:
linear-gradient(
90deg,
#ff0000,
#ff8800,
#ffff00,
#00ff88,
#00ffff,
#0088ff,
#ff00ff,
#ff0000
);

background-size:400%;

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

animation:rgbFlow 8s linear infinite;
}

@keyframes rgbFlow{

0%{
background-position:0%;
}

100%{
background-position:400%;
}

}

.hero p{
max-width:760px;
margin:24px auto 0;
font-size:20px;
color:#666;
}

.button{
display:inline-block;
margin-top:30px;
padding:14px 22px;
border-radius:999px;
background:#111;
color:#fff;
text-decoration:none;
font-weight:700;
transition:.3s;
}

.button:hover{
transform:translateY(-3px);
}

/* =========================
Content
========================= */

.container{
width:min(1180px,100%);
margin:auto;
padding:0 20px;
}

.section{
padding:90px 0;
}

.grid{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:22px;
}

.card{

position:relative;

overflow:hidden;

background:#f5f5f5;

padding:30px;

border-radius:30px;

box-shadow:0 20px 50px rgba(0,0,0,.06);

transition:.3s;
}

.card:hover{
transform:translateY(-8px);
}

.card::before{

content:"";

position:absolute;

inset:-2px;

background:
linear-gradient(
90deg,
red,
orange,
yellow,
lime,
cyan,
blue,
magenta,
red
);

background-size:400%;

animation:
rgbBorder 8s linear infinite;

opacity:0;

transition:.3s;
}

.card:hover::before{
opacity:1;
}

.card>*{
position:relative;
z-index:2;
}

@keyframes rgbBorder{

0%{
background-position:0%;
}

100%{
background-position:400%;
}

}

.card h3{
font-size:30px;
margin-bottom:10px;
}

.card p{
color:#666;
}

/* =========================
Footer
========================= */

.footer{
padding:50px 20px 80px;
color:#777;
}

.footer-inner{
width:min(1180px,100%);
margin:auto;
padding-top:24px;
border-top:1px solid rgba(0,0,0,.08);
display:flex;
justify-content:space-between;
flex-wrap:wrap;
}

/* =========================
Responsive
========================= */

@media(max-width:900px){

.grid{
grid-template-columns:1fr;
}

.nav{
padding:12px 16px;
}

.hero h1{
font-size:clamp(60px,20vw,120px);
}

}

</style>
</head>
<body>

<div id="aurora"></div>
<div id="cursor-glow"></div>

<nav class="nav">

<div class="logo">LOVE</div>

<div class="links">
<a href="/">Home</a>
<a href="/about">About</a>
<a href="/gallery">Gallery</a>
<a href="/projects">Projects</a>
<a href="/editor">Editor</a>
<a href="/contact">Contact</a>
</div>

</nav>

<section class="hero">

<div>

<h1>LOVE NIGGA</h1>

<p>
There are a lot of niggas around the world.<br>
We love all the Niggas.
</p>

<a class="button" href="/projects">
Explore More
</a>

</div>

</section>

<section class="section">

<div class="container">

<div class="grid">

<div class="card">
<h3>Fast</h3>
<p>超輕量靜態網站架構，部署速度非常快。</p>
</div>

<div class="card">
<h3>Expandable</h3>
<p>現在已經有完整子頁架構，可繼續新增更多內容。</p>
</div>

<div class="card">
<h3>Editable</h3>
<p>網站已經包含 editor 頁面，之後可升級成 CMS。</p>
</div>

</div>

</div>

</section>

<footer class="footer">

<div class="footer-inner">

<div>LOVE Website</div>

<div>Static HTML Structure · Vercel Ready</div>

</div>

</footer>

<script>

const root=document.documentElement;

const cursor=
document.getElementById(
"cursor-glow"
);

window.addEventListener(
"mousemove",
e=>{

root.style.setProperty(
"--mx",
e.clientX+"px"
);

root.style.setProperty(
"--my",
e.clientY+"px"
);

cursor.style.left=
e.clientX+"px";

cursor.style.top=
e.clientY+"px";

}
);

</script>

</body>
</html>
